<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المنظومة غير متصلة بالإنترنت - بوابة التعليم الفني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background-color: #020617;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1.5rem;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 4rem;
      height: 4rem;
      border-radius: 1rem;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0 0 0.5rem;
      color: #ffffff;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.6;
      margin: 0 0 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      background: #f59e0b;
      color: #020617;
      font-weight: 700;
      font-size: 0.875rem;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #d97706;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>تعذر الاتصال بالشبكة</h1>
    <p>أنت الآن في وضع غير متصل بالإنترنت. البيانات المسجلة محلياً في الورشة أو الفصل سيتم حفظها ومزامنتها تلقائياً فور عودة الاتصال.</p>
    <button class="btn" onclick="window.location.reload()">إعادة المحاولة والتحقق من الشبكة</button>
  </div>
</body>
</html>
