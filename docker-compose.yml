version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database with Row-Level Security Support
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: egyptian_tech_school_db
    restart: always
    environment:
      POSTGRES_DB: egyptian_technical_schools
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: StrongProductionPassword2026!
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/rls_policies.sql:/docker-entrypoint-initdb.d/02_rls.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_admin -d egyptian_technical_schools"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Next.js Application Server (On-Premise)
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: egyptian_tech_school_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://school_admin:StrongProductionPassword2026!@postgres:5432/egyptian_technical_schools?schema=public
      AUTH_SECRET: super_secure_32_byte_secret_key_directorate_cairo_2026
      ENCRYPTION_KEY_HEX: e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2
      NEXTAUTH_URL: http://localhost:3000
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    driver: local
